# ChampHarbinger self-host.
#
# Local stack: Next.js app + Postgres 16. No external services required for
# a clean boot — Clerk runs in Keyless mode and OpenRouter only needs an API
# key (set in .env.local) when you exercise AI flows.
#
# Minimal setup:
#   cp .env.example .env.local
#   # fill in OPENROUTER_API_KEY at minimum (Clerk Keyless covers auth in dev)
#   docker compose up -d postgres   # start Postgres only, then run dev outside Docker
#   pnpm db:migrate
#   pnpm dev
#
# Or run the full containerized stack:
#   docker compose up -d
#
# The app will be reachable at http://localhost:3000.

services:
  postgres:
    image: postgres:16-alpine
    container_name: harbinger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: harbinger
      POSTGRES_PASSWORD: harbinger
      POSTGRES_DB: champ_harbinger
    ports:
      - "5436:5432"
    volumes:
      - harbinger-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbinger -d champ_harbinger"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time env (inlined into the client bundle).
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_HARBINGER_APP_URL: ${NEXT_PUBLIC_HARBINGER_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
    image: champ-harbinger:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      trafilatura:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://harbinger:harbinger@postgres:5432/champ_harbinger
      # Self-hosted scraping + discovery (free).
      OBSCURA_GATEWAY_URL: http://obscura:9223
      TRAFILATURA_BASE_URL: http://trafilatura:8001
      SEARXNG_URL: http://searxng:8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/metrics', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Background worker: pg-boss schedules + job handlers. Shares the DB with the
  # app and reaches it over the compose network for job-triggered routes.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: champ-harbinger-worker:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://harbinger:harbinger@postgres:5432/champ_harbinger
      WORKER_TARGET_URL: http://app:3000
      OBSCURA_GATEWAY_URL: http://obscura:9223
      TRAFILATURA_BASE_URL: http://trafilatura:8001
      SEARXNG_URL: http://searxng:8080

  # Obscura — self-hosted Rust headless browser (replaces Browserbase) wrapped
  # in a tiny HTTP gateway (services/obscura-gateway) exposing POST /fetch.
  # Obscura's `serve` CDP is page-level only and not Playwright-compatible, so
  # the gateway shells the `obscura fetch` renderer instead.
  obscura:
    build:
      context: ./services/obscura-gateway
      dockerfile: Dockerfile
    image: champ-harbinger-obscura-gateway:latest
    container_name: harbinger-obscura
    restart: unless-stopped
    ports:
      - "9223:9223"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:9223/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Trafilatura — self-hosted article extraction microservice (static tier).
  trafilatura:
    build:
      context: ./services/trafilatura
      dockerfile: Dockerfile
    image: champ-harbinger-trafilatura:latest
    container_name: harbinger-trafilatura
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # SearXNG — self-hosted metasearch backend for public-web discovery (WS3).
  # Needs services/searxng/settings.yml enabling the JSON output format.
  searxng:
    image: searxng/searxng:latest
    container_name: harbinger-searxng
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8090/
    volumes:
      - ./services/searxng:/etc/searxng:rw

  # Crawl4AI — self-hosted Python bulk-crawl microservice. Bandwidth-only
  # alternative to Browserbase for large (1M+) company scrapes. Optional: the
  # app boots without it; bulk-crawl tools surface a 'not configured' error.
  crawl4ai:
    build:
      context: ./services/crawl4ai
      dockerfile: Dockerfile
    image: champ-harbinger-crawl4ai:latest
    container_name: harbinger-crawl4ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Self-hosted metrics store. Scrapes the app's /api/metrics and serves as a
  # Grafana data source. See prometheus/prometheus.yml.
  prometheus:
    image: prom/prometheus:latest
    container_name: harbinger-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - harbinger-prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      app:
        condition: service_healthy

volumes:
  harbinger-pg-data:
  harbinger-prom-data:
