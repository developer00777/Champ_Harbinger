# ChampHarbinger self-host.
#
# Local stack: Next.js app + Postgres 16. No external services required for
# a clean boot — Clerk runs in Keyless mode and OpenRouter only needs an API
# key (set in .env.local) when you exercise AI flows.
#
# Minimal setup:
#   cp .env.example .env.local
#   # fill in OPENROUTER_API_KEY at minimum (Clerk Keyless covers auth in dev)
#   docker compose up -d postgres   # start Postgres only, then run dev outside Docker
#   pnpm db:migrate
#   pnpm dev
#
# Or run the full containerized stack:
#   docker compose up -d
#
# The app will be reachable at http://localhost:3000.

services:
  postgres:
    image: postgres:16-alpine
    container_name: harbinger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: harbinger
      POSTGRES_PASSWORD: harbinger
      POSTGRES_DB: champ_harbinger
    ports:
      - "5432:5432"
    volumes:
      - harbinger-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbinger -d champ_harbinger"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time env (inlined into the client bundle).
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_HARBINGER_APP_URL: ${NEXT_PUBLIC_HARBINGER_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
    image: champ-harbinger:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://harbinger:harbinger@postgres:5432/champ_harbinger
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/metrics', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Ollama — optional self-hosted LLM for classification (criteria translation,
  # signal verification). When configured, ChampHarbinger routes classification
  # workloads here instead of OpenRouter, dropping per-call cost to zero.
  #
  # Apple Silicon users: this container runs Ollama on CPU. For native Metal
  # acceleration, install Ollama natively (`brew install ollama`), run
  # `ollama serve`, and set OLLAMA_BASE_URL=http://host.docker.internal:11434
  # in .env.local instead of starting this service.
  #
  # Pull a model after the container is up:
  #   docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    container_name: harbinger-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  harbinger-pg-data:
  ollama-data:
